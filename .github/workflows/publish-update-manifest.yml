name: Publish update manifest

on:
  workflow_run:
    workflows: [Build multiplatform release]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'script/assemble-pages.py'
      - 'script/test_assemble_pages.py'
      - '.github/workflows/publish-update-manifest.yml'

permissions:
  contents: read

concurrency:
  group: zed-cn-update-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'rxp200/zed-cn' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Generate feed from completed public releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 script/generate-update-manifest.py --output update-site/updates.json
          gh api --paginate --slurp 'repos/rxp200/zed-cn/releases?per_page=100' > listed-releases.json
          if python3 -c 'import json,sys; sys.exit(not any(r["tag_name"].startswith("zed-cn-dev-v") and not r["draft"] for page in json.load(open("listed-releases.json")) for r in page))'; then
            python3 script/generate-update-manifest.py --channel dev --output update-site/updates-dev.json
          fi
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build and test public website
        working-directory: website
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble website and unchanged update feeds
        run: |
          python3 -m unittest script/test_assemble_pages.py script/test_generate_update_manifest.py
          python3 script/assemble-pages.py
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload website and update feeds
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: update-site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify deployed feed
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for feed in update-site/*.json; do
            verified=false
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location --max-time 30 "${PAGE_URL%/}/$(basename "$feed")" -o deployed-updates.json && cmp "$feed" deployed-updates.json; then
                verified=true
                break
              fi
              sleep 10
            done
            if [[ "$verified" != true ]]; then
              echo "The deployed update feed $feed could not be verified." >&2
              exit 1
            fi
          done
          verified=false
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 30 "${PAGE_URL%/}/" -o deployed-index.html && cmp update-site/index.html deployed-index.html; then
              verified=true
              break
            fi
            sleep 10
          done
          if [[ "$verified" != true ]]; then
            echo "The deployed website index could not be verified." >&2
            exit 1
          fi
