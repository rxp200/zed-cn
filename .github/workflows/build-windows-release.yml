name: Build multiplatform release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Public-safe custom-vX.Y.Z branch, tag, or commit selected from the latest formal Stable
        required: true
        type: string
      release_tag:
        description: Release tag, for example zed-cn-v1.17.2-r1
        required: true
        type: string
      draft:
        description: Create the GitHub Release as a draft
        required: true
        default: true
        type: boolean
  push:
    tags:
      - zed-cn-v*-r*

permissions:
  contents: write

concurrency:
  group: multiplatform-release-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  validate_source:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_ref: ${{ steps.inputs.outputs.source_ref }}
      release_tag: ${{ steps.inputs.outputs.release_tag }}
      release_version: ${{ steps.inputs.outputs.release_version }}
      release_revision: ${{ steps.inputs.outputs.release_revision }}
      draft: ${{ steps.inputs.outputs.draft }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      public_main_sha: ${{ steps.source.outputs.public_main_sha }}
    steps:
      - name: Resolve build inputs
        id: inputs
        shell: pwsh
        env:
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ github.event_name }}" -eq "push") {
              $sourceRef = "${{ github.ref }}"
              $releaseTag = "${{ github.ref_name }}"
              $draft = "false"
          } else {
              $sourceRef = $env:DISPATCH_SOURCE_REF.Trim()
              $releaseTag = $env:DISPATCH_RELEASE_TAG.Trim()
              $draft = "${{ inputs.draft }}".ToLowerInvariant()
          }

          if ($releaseTag -notmatch '^zed-cn-v(?<version>\d+\.\d+\.\d+)-r(?<revision>\d+)$') {
              throw "Release tag must use the format zed-cn-vX.Y.Z-rN, for example zed-cn-v1.17.2-r1"
          }

          "source_ref=$sourceRef" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "release_version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          "release_revision=$($Matches.revision)" >> $env:GITHUB_OUTPUT
          "draft=$draft" >> $env:GITHUB_OUTPUT

      - name: Check out public-safe source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ steps.inputs.outputs.source_ref }}
          fetch-depth: 0
          clean: true

      - name: Validate source version and public main completeness
        id: source
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.inputs.outputs.release_version }}
        run: |
          $ErrorActionPreference = "Stop"

          $sourceSha = (git rev-parse HEAD).Trim()
          $channel = (Get-Content "crates/zed/RELEASE_CHANNEL" -Raw).Trim()
          $metadataJson = cargo metadata --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to resolve Cargo metadata while validating the release source"
          }
          $metadata = $metadataJson | ConvertFrom-Json -AsHashtable
          $manifestVersion = $metadata["packages"] |
              Where-Object { $_["name"] -eq "zed" } |
              ForEach-Object { $_["version"] }
          $commitBody = git show -s --format=%B HEAD | Out-String
          $publicMainMatch = [regex]::Match(
              $commitBody,
              '(?m)^Public-Main-Source:\s*(?<sha>[0-9a-f]{40})\s*$'
          )

          if ($channel -ne "stable") {
              throw "The selected source uses release channel '$channel'. Stable releases must be built from a custom Stable branch."
          }
          if ($manifestVersion -ne $env:EXPECTED_VERSION) {
              throw "Release tag version $env:EXPECTED_VERSION does not match the selected source version $manifestVersion."
          }
          if (-not $publicMainMatch.Success) {
              throw "The Stable source commit must contain a Public-Main-Source trailer generated by script/prepare-public-stable-release."
          }

          $releaseNotesMatch = [regex]::Match(
              $commitBody,
              '(?ms)^Zed-CN-Release-Notes:\s*\r?\n(?<notes>.+?)\r?\nZed-CN-Release-Notes-End(?=\r?\n|$)'
          )
          if (-not $releaseNotesMatch.Success) {
              throw "The Stable source commit must contain detailed Zed-CN-Release-Notes markers."
          }
          $releaseNotes = $releaseNotesMatch.Groups['notes'].Value.Trim()
          $requiredHeadings = @('## 本次更新', '## 功能', '## 改进', '## 错误修复', '## 重大变更与通知')
          foreach ($heading in $requiredHeadings) {
              if (-not $releaseNotes.Contains($heading)) {
                  throw "Detailed release notes are missing required heading '$heading'."
              }
          }
          if ($releaseNotes -match '<!--' -or $releaseNotes -notmatch '[\p{IsCJKUnifiedIdeographs}]') {
              throw "Detailed release notes must replace every template placeholder with reviewed Chinese content."
          }

          $publicMainSha = $publicMainMatch.Groups['sha'].Value
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to fetch the current public main branch for completeness validation."
          }
          $currentPublicMainSha = (git rev-parse FETCH_HEAD).Trim()
          if ($publicMainSha -ne $currentPublicMainSha) {
              throw "Stable source was generated from public main $publicMainSha, but current public main is $currentPublicMainSha."
          }

          $stableOverlayPaths = @(
              '.rules',
              'AGENTS.md',
              'Cargo.lock',
              'crates/zed/Cargo.toml',
              'crates/zed/RELEASE_CHANNEL'
          )
          $treeDifferences = @(git diff --name-only $publicMainSha HEAD -- . |
              Where-Object { $_ -notin $stableOverlayPaths })
          if ($treeDifferences.Count -ne 0) {
              throw "Stable source is missing or changes public main files outside the approved Stable overlay: $($treeDifferences -join ', ')"
          }

          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT
          "public_main_sha=$publicMainSha" >> $env:GITHUB_OUTPUT
          Write-Host "Source SHA: $sourceSha"
          Write-Host "Release channel: $channel"
          Write-Host "Version: $manifestVersion"

  bundle_linux:
    name: Build Linux ${{ matrix.arch }}
    needs: validate_source
    continue-on-error: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      CARGO_BUILD_JOBS: "2"
      ZED_COMMIT_SHA: ${{ needs.validate_source.outputs.source_sha }}
    steps:
      - name: Check out release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.validate_source.outputs.source_ref }}
          clean: true

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install Linux build dependencies
        run: ./script/linux

      - name: Download WASI SDK
        run: ./script/download-wasi-sdk

      - name: Build Linux bundle and Remote Server
        run: ./script/bundle-linux

      - name: Verify Linux build
        env:
          EXPECTED_SHA: ${{ needs.validate_source.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.validate_source.outputs.release_version }}
        run: |
          cli="target/$(rustc --version --verbose | awk '/^host:/ { print $2 }')/release/cli"
          cli_version="$($cli --version)"
          echo "CLI: $cli_version"
          grep -F "$EXPECTED_VERSION" <<<"$cli_version"
          grep -F "$EXPECTED_SHA" <<<"$cli_version"
          test -f "target/release/zed-linux-${{ matrix.arch }}.tar.gz"
          test -f "target/zed-remote-server-linux-${{ matrix.arch }}.gz"

      - name: Upload Linux desktop bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-zed-linux-${{ matrix.arch }}.tar.gz
          path: target/release/zed-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux Remote Server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-zed-remote-server-linux-${{ matrix.arch }}.gz
          path: target/zed-remote-server-linux-${{ matrix.arch }}.gz
          if-no-files-found: error
          retention-days: 7

  build_static_bwrap:
    name: Build static bwrap Linux ${{ matrix.arch }}
    needs: validate_source
    continue-on-error: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build static bubblewrap
        run: |
          nix build nixpkgs#pkgsStatic.bubblewrap -L
          cp result/bin/bwrap "bwrap-linux-${{ matrix.arch }}"
          chmod 755 "bwrap-linux-${{ matrix.arch }}"
          gzip --stdout --best "bwrap-linux-${{ matrix.arch }}" > "bwrap-linux-${{ matrix.arch }}.gz"

      - name: Upload static bubblewrap
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-bwrap-linux-${{ matrix.arch }}.gz
          path: bwrap-linux-${{ matrix.arch }}.gz
          if-no-files-found: error
          retention-days: 7

  bundle_macos:
    name: Build macOS ${{ matrix.arch }}
    needs: validate_source
    continue-on-error: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-15
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    env:
      CARGO_BUILD_JOBS: "3"
      ZED_COMMIT_SHA: ${{ needs.validate_source.outputs.source_sha }}
    steps:
      - name: Check out release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.validate_source.outputs.source_ref }}
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false

      - name: Build macOS DMG and Remote Server
        run: ./script/bundle-mac ${{ matrix.target }}

      - name: Verify macOS build
        env:
          EXPECTED_SHA: ${{ needs.validate_source.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.validate_source.outputs.release_version }}
        run: |
          cli_version="$(target/${{ matrix.target }}/release/cli --version)"
          echo "CLI: $cli_version"
          grep -F "$EXPECTED_VERSION" <<<"$cli_version"
          grep -F "$EXPECTED_SHA" <<<"$cli_version"
          test -f "target/${{ matrix.target }}/release/Zed-${{ matrix.arch }}.dmg"
          test -f "target/zed-remote-server-macos-${{ matrix.arch }}.gz"

      - name: Upload macOS desktop bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-Zed-${{ matrix.arch }}.dmg
          path: target/${{ matrix.target }}/release/Zed-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS Remote Server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-zed-remote-server-macos-${{ matrix.arch }}.gz
          path: target/zed-remote-server-macos-${{ matrix.arch }}.gz
          if-no-files-found: error
          retention-days: 7

  bundle_windows:
    name: Build Windows ${{ matrix.arch }}
    needs: validate_source
    continue-on-error: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
          - arch: aarch64
            runner: windows-2022
    env:
      CARGO_BUILD_JOBS: "3"
      ZED_COMMIT_SHA: ${{ needs.validate_source.outputs.source_sha }}
      ZED_WORKSPACE: ${{ github.workspace }}
      RELEASE_VERSION: ${{ needs.validate_source.outputs.release_version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.validate_source.outputs.source_ref }}
          clean: true

      - name: Free runner disk space
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $paths = @(
              $env:ANDROID_HOME,
              $env:ANDROID_NDK_ROOT,
              "C:\Android",
              "C:\ghcup",
              "C:\hostedtoolcache\windows\CodeQL",
              "C:\Program Files\Unity Hub",
              "C:\Program Files\Microsoft SQL Server",
              "C:\Program Files (x86)\Microsoft SQL Server"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($path in $paths) {
              Write-Host "Removing unused runner component: $path"
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Continue
          }
          $global:LASTEXITCODE = 0
          $drive = Get-PSDrive C
          $drive | Format-Table -AutoSize
          if ($drive.Free -lt 30GB) {
              throw "Only $([math]::Round($drive.Free / 1GB, 2)) GiB is free after cleanup; at least 30 GiB is required for this build"
          }
          $ErrorActionPreference = "Stop"

      - name: Prepare Windows build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup show

          $innoSetupPath = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $innoSetupPath) {
              choco install innosetup --yes --no-progress
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to install Inno Setup 6"
              }
          }

      - name: Download WebRTC with retries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadataJson = cargo metadata --format-version 1
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to resolve Cargo metadata before downloading WebRTC"
          }
          $metadata = $metadataJson | ConvertFrom-Json -AsHashtable
          $webrtcPackage = @($metadata["packages"] | Where-Object { $_["name"] -eq "webrtc-sys" })
          if ($webrtcPackage.Count -ne 1) {
              throw "Expected exactly one webrtc-sys package, found $($webrtcPackage.Count)"
          }
          $webrtcBuildSource = Join-Path (Split-Path $webrtcPackage[0]["manifest_path"]) "build/src/lib.rs"
          $tagMatch = [regex]::Match((Get-Content $webrtcBuildSource -Raw), 'pub const WEBRTC_TAG:\s*&str\s*=\s*"(?<tag>[^"]+)";')
          if (-not $tagMatch.Success) {
              throw "Could not determine WEBRTC_TAG from $webrtcBuildSource"
          }
          $webrtcTag = $tagMatch.Groups['tag'].Value
          $webrtcArch = if ("${{ matrix.arch }}" -eq "x86_64") { "x64" } else { "arm64" }
          $archiveName = "webrtc-win-$webrtcArch-release.zip"
          $downloadUrl = "https://github.com/zed-industries/livekit-rust-sdks/releases/download/$webrtcTag/$archiveName"
          $downloadDirectory = Join-Path $env:RUNNER_TEMP "livekit-webrtc"
          $archivePath = Join-Path $downloadDirectory $archiveName
          $extractDirectory = Join-Path $downloadDirectory $webrtcTag
          $webrtcDirectory = Join-Path $extractDirectory "win-$webrtcArch-release"

          New-Item -ItemType Directory -Force -Path $downloadDirectory | Out-Null
          curl.exe --fail --location --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 30 --output $archivePath $downloadUrl
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to download WebRTC after retries: $downloadUrl"
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractDirectory -Force
          if (-not (Test-Path (Join-Path $webrtcDirectory "webrtc.ninja")) -or
              -not (Test-Path (Join-Path $webrtcDirectory "desktop_capture.ninja")) -or
              -not (Test-Path (Join-Path $webrtcDirectory "lib"))) {
              throw "Downloaded WebRTC archive does not contain the expected win-$webrtcArch-release layout"
          }
          "LK_CUSTOM_WEBRTC=$webrtcDirectory" >> $env:GITHUB_ENV

      - name: Build Windows installer and Remote Server
        shell: pwsh
        run: script/bundle-windows.ps1 -Architecture ${{ matrix.arch }}

      - name: Verify Windows build
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.validate_source.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.validate_source.outputs.release_version }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Resolve-Path "target/Zed-${{ matrix.arch }}.exe"
          $remoteServer = Resolve-Path "target/zed-remote-server-windows-${{ matrix.arch }}.zip"
          $cli = Resolve-Path "target/${{ matrix.arch }}-pc-windows-msvc/release/cli.exe"
          if ("${{ matrix.arch }}" -eq "x86_64") {
              $cliVersion = (& $cli --version | Out-String).Trim()
              if ($cliVersion -notmatch [regex]::Escape($env:EXPECTED_VERSION)) {
                  throw "CLI version does not contain expected version $env:EXPECTED_VERSION`: $cliVersion"
              }
              if ($cliVersion -notmatch [regex]::Escape($env:EXPECTED_SHA)) {
                  throw "CLI version does not contain expected source SHA $env:EXPECTED_SHA`: $cliVersion"
              }
              Write-Host "CLI: $cliVersion"
          } else {
              $cliBytes = [System.IO.File]::ReadAllBytes($cli)
              $peOffset = [BitConverter]::ToInt32($cliBytes, 0x3c)
              $machine = [BitConverter]::ToUInt16($cliBytes, $peOffset + 4)
              if ($machine -ne 0xAA64) {
                  throw "CLI PE machine is 0x$($machine.ToString('X4')); expected ARM64 (0xAA64)"
              }
              $cliContents = [Text.Encoding]::ASCII.GetString($cliBytes)
              if (-not $cliContents.Contains($env:EXPECTED_VERSION)) {
                  throw "ARM64 CLI does not contain expected version $env:EXPECTED_VERSION"
              }
              if (-not $cliContents.Contains($env:EXPECTED_SHA)) {
                  throw "ARM64 CLI does not contain expected source SHA $env:EXPECTED_SHA"
              }
              Write-Host "ARM64 CLI architecture and embedded build identity verified"
          }
          Write-Host "Installer: $installer"
          Write-Host "Remote Server: $remoteServer"

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-Zed-${{ matrix.arch }}.exe
          path: target/Zed-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows Remote Server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-zed-remote-server-windows-${{ matrix.arch }}.zip
          path: target/zed-remote-server-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

  publish_release:
    name: Publish GitHub Release assets
    needs:
      - validate_source
      - bundle_linux
      - build_static_bwrap
      - bundle_macos
      - bundle_windows
    if: ${{ always() && needs.validate_source.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.validate_source.outputs.source_ref }}
          fetch-depth: 0
          clean: true

      - name: Download all release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Validate available assets and generate checksums
        run: |
          expected_assets=(
            bwrap-linux-aarch64.gz
            bwrap-linux-x86_64.gz
            Zed-aarch64.dmg
            Zed-aarch64.exe
            zed-linux-aarch64.tar.gz
            zed-linux-x86_64.tar.gz
            zed-remote-server-linux-aarch64.gz
            zed-remote-server-linux-x86_64.gz
            zed-remote-server-macos-aarch64.gz
            zed-remote-server-macos-x86_64.gz
            zed-remote-server-windows-aarch64.zip
            zed-remote-server-windows-x86_64.zip
            Zed-x86_64.dmg
            Zed-x86_64.exe
          )
          mapfile -t actual_assets < <(find release-artifacts -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${#actual_assets[@]}" -gt 0 || {
            echo "No release assets were produced by successful build jobs." >&2
            exit 1
          }
          for asset in "${actual_assets[@]}"; do
            [[ " ${expected_assets[*]} " == *" $asset "* ]] || {
              echo "Unexpected release asset: $asset" >&2
              exit 1
            }
            test -s "release-artifacts/$asset" || {
              echo "Empty release asset: $asset" >&2
              exit 1
            }
          done
          : > release-artifacts/MISSING-ASSETS.txt
          for asset in "${expected_assets[@]}"; do
            if [[ ! -s "release-artifacts/$asset" ]]; then
              echo "$asset" | tee -a release-artifacts/MISSING-ASSETS.txt
            fi
          done
          (cd release-artifacts && sha256sum "${actual_assets[@]}" | sort -k2 > SHA256SUMS.txt)
          cat release-artifacts/SHA256SUMS.txt

      - name: Upload consolidated workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Zed-CN-${{ needs.validate_source.outputs.release_version }}-all-platforms
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate_source.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate_source.outputs.release_version }}
          RELEASE_REVISION: ${{ needs.validate_source.outputs.release_revision }}
          SOURCE_SHA: ${{ needs.validate_source.outputs.source_sha }}
          CREATE_DRAFT: ${{ needs.validate_source.outputs.draft }}
        run: |
          notes_path="release-notes.md"
          commit_body="$(git show -s --format=%B HEAD)"
          detailed_notes="$(printf '%s\n' "$commit_body" | sed -n '/^Zed-CN-Release-Notes:$/,/^Zed-CN-Release-Notes-End$/p' | sed '1d;$d')"
          if [[ -z "$detailed_notes" ]]; then
            echo "Detailed Zed CN release notes were not found in the Stable source commit." >&2
            exit 1
          fi

          cat > "$notes_path" <<EOF
          $detailed_notes

          ## 构建信息

          - Zed 版本：$RELEASE_VERSION
          - 定制修订：r$RELEASE_REVISION
          - 源码提交：\`$SOURCE_SHA\`
          - 发布渠道：stable
          - 代码签名：Windows 未签名，macOS 使用临时签名且未公证

          本次 Release 包含所有成功完成构建并通过验证的产物。失败平台的产物不会阻止其他平台发布，也不会作为空文件上传。所有已发布二进制的 SHA-256 见 \`SHA256SUMS.txt\`。Windows SmartScreen 和 macOS Gatekeeper 可能显示警告。
          EOF

          if [[ -s release-artifacts/MISSING-ASSETS.txt ]]; then
            {
              echo
              echo "## 本次未生成的产物"
              echo
              while IFS= read -r asset; do
                echo "- \`$asset\`"
              done < release-artifacts/MISSING-ASSETS.txt
            } >> "$notes_path"
          fi

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "Zed CN $RELEASE_VERSION r$RELEASE_REVISION" \
              --notes-file "$notes_path"
          else
            arguments=(
              release create "$RELEASE_TAG"
              --repo "${{ github.repository }}"
              --target "$SOURCE_SHA"
              --title "Zed CN $RELEASE_VERSION r$RELEASE_REVISION"
              --notes-file "$notes_path"
            )
            if [[ "$CREATE_DRAFT" == "true" ]]; then
              arguments+=(--draft)
            fi
            gh "${arguments[@]}"
          fi

          rm -f release-artifacts/MISSING-ASSETS.txt
          gh release upload "$RELEASE_TAG" release-artifacts/* \
            --repo "${{ github.repository }}" \
            --clobber
