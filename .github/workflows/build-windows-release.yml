name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Public-safe custom-vX.Y.Z branch, tag, or commit selected from the latest formal Stable
        required: true
        type: string
      release_tag:
        description: Release tag, for example zed-cn-v1.17.2-r1
        required: true
        type: string
      draft:
        description: Create the GitHub Release as a draft
        required: true
        default: true
        type: boolean
  push:
    tags:
      - zed-cn-v*-r*

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "3"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build_windows_x86_64:
    name: Build Windows x86_64 installer
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Resolve build inputs
        id: inputs
        shell: pwsh
        env:
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ github.event_name }}" -eq "push") {
              $sourceRef = "${{ github.ref }}"
              $releaseTag = "${{ github.ref_name }}"
              $draft = "false"
          } else {
              $sourceRef = $env:DISPATCH_SOURCE_REF.Trim()
              $releaseTag = $env:DISPATCH_RELEASE_TAG.Trim()
              $draft = "${{ inputs.draft }}".ToLowerInvariant()
          }

          if ($releaseTag -notmatch '^zed-cn-v(?<version>\d+\.\d+\.\d+)-r(?<revision>\d+)$') {
              throw "Release tag must use the format zed-cn-vX.Y.Z-rN, for example zed-cn-v1.17.2-r1"
          }

          "source_ref=$sourceRef" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "release_version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          "release_revision=$($Matches.revision)" >> $env:GITHUB_OUTPUT
          "draft=$draft" >> $env:GITHUB_OUTPUT

      - name: Check out public-safe source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ steps.inputs.outputs.source_ref }}
          fetch-depth: 0
          clean: true

      - name: Validate source version and public main completeness
        id: source
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.inputs.outputs.release_version }}
        run: |
          $ErrorActionPreference = "Stop"

          $sourceSha = (git rev-parse HEAD).Trim()
          $channel = (Get-Content "crates/zed/RELEASE_CHANNEL" -Raw).Trim()
          $manifestVersion = cargo metadata --no-deps --format-version 1 |
              ConvertFrom-Json |
              Select-Object -ExpandProperty packages |
              Where-Object { $_.name -eq "zed" } |
              Select-Object -ExpandProperty version
          $commitBody = git show -s --format=%B HEAD | Out-String
          $publicMainMatch = [regex]::Match(
              $commitBody,
              '(?m)^Public-Main-Source:\s*(?<sha>[0-9a-f]{40})\s*$'
          )

          if ($channel -ne "stable") {
              throw "The selected source uses release channel '$channel'. Stable releases must be built from a custom Stable branch."
          }
          if ($manifestVersion -ne $env:EXPECTED_VERSION) {
              throw "Release tag version $env:EXPECTED_VERSION does not match the selected source version $manifestVersion."
          }
          if (-not $publicMainMatch.Success) {
              throw "The Stable source commit must contain a Public-Main-Source trailer generated by script/prepare-public-stable-release."
          }

          $releaseNotesMatch = [regex]::Match(
              $commitBody,
              '(?ms)^Zed-CN-Release-Notes:\s*\r?\n(?<notes>.+?)\r?\nZed-CN-Release-Notes-End(?=\r?\n|$)'
          )
          if (-not $releaseNotesMatch.Success) {
              throw "The Stable source commit must contain detailed Zed-CN-Release-Notes markers."
          }
          $releaseNotes = $releaseNotesMatch.Groups['notes'].Value.Trim()
          $requiredHeadings = @('## 本次更新', '## 功能', '## 改进', '## 错误修复', '## 重大变更与通知')
          foreach ($heading in $requiredHeadings) {
              if (-not $releaseNotes.Contains($heading)) {
                  throw "Detailed release notes are missing required heading '$heading'."
              }
          }
          if ($releaseNotes -match '<!--' -or $releaseNotes -notmatch '[\p{IsCJKUnifiedIdeographs}]') {
              throw "Detailed release notes must replace every template placeholder with reviewed Chinese content."
          }

          $publicMainSha = $publicMainMatch.Groups['sha'].Value
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to fetch the current public main branch for completeness validation."
          }
          $currentPublicMainSha = (git rev-parse FETCH_HEAD).Trim()
          if ($publicMainSha -ne $currentPublicMainSha) {
              throw "Stable source was generated from public main $publicMainSha, but current public main is $currentPublicMainSha."
          }

          $stableOverlayPaths = @(
              '.rules',
              'AGENTS.md',
              'Cargo.lock',
              'crates/zed/Cargo.toml',
              'crates/zed/RELEASE_CHANNEL'
          )
          $treeDifferences = @(git diff --name-only $publicMainSha HEAD -- . |
              Where-Object { $_ -notin $stableOverlayPaths })
          if ($treeDifferences.Count -ne 0) {
              throw "Stable source is missing or changes public main files outside the approved Stable overlay: $($treeDifferences -join ', ')"
          }

          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT
          "public_main_sha=$publicMainSha" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "version=$manifestVersion" >> $env:GITHUB_OUTPUT

          "ZED_COMMIT_SHA=$sourceSha" >> $env:GITHUB_ENV
          "ZED_WORKSPACE=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$manifestVersion" >> $env:GITHUB_ENV

          Write-Host "Source SHA: $sourceSha"
          Write-Host "Release channel: $channel"
          Write-Host "Version: $manifestVersion"

      - name: Free runner disk space
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Get-PSDrive C | Format-Table -AutoSize
          $paths = @(
              $env:ANDROID_HOME,
              $env:ANDROID_NDK_ROOT,
              "C:\Android",
              "C:\ghcup",
              "C:\hostedtoolcache\windows\CodeQL",
              "C:\Program Files\Unity Hub",
              "C:\Program Files\Microsoft SQL Server",
              "C:\Program Files (x86)\Microsoft SQL Server"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          foreach ($path in $paths) {
              Write-Host "Removing unused runner component: $path"
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Continue
          }

          $docker = Get-Command "docker" -ErrorAction SilentlyContinue
          if ($docker) {
              docker system prune --all --force 2>$null
              if ($LASTEXITCODE -ne 0) {
                  Write-Warning "Docker cleanup failed with exit code $LASTEXITCODE; continuing with the disk-space check."
              }
          }

          $global:LASTEXITCODE = 0
          $drive = Get-PSDrive C
          $drive | Format-Table -AutoSize
          if ($drive.Free -lt 30GB) {
              throw "Only $([math]::Round($drive.Free / 1GB, 2)) GiB is free after cleanup; at least 30 GiB is required for this build"
          }
          $ErrorActionPreference = "Stop"

      - name: Prepare Windows build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          rustup show
          Write-Host "Cargo build jobs: $env:CARGO_BUILD_JOBS of $env:NUMBER_OF_PROCESSORS logical processors"

          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudioPath = (& $vsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $visualStudioPath) {
              throw "Visual Studio C++ build tools were not found"
          }

          $devShell = Join-Path $visualStudioPath "Common7\Tools\Launch-VsDevShell.ps1"
          $windowsKitsBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $sdkPath = Get-ChildItem -Path $windowsKitsBin -Directory |
              Where-Object { Test-Path (Join-Path $_.FullName "x64\makeappx.exe") } |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkPath) {
              throw "A Windows SDK containing makeappx.exe was not found"
          }
          $sdkPath = Join-Path $sdkPath "x64"

          $innoSetupCommand = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          $innoSetupPath = if ($innoSetupCommand) {
              $innoSetupCommand.Source
          } else {
              @(
                  "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                  "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
              ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $innoSetupPath) {
              choco install innosetup --yes --no-progress
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to install Inno Setup 6"
              }
              $innoSetupPath = @(
                  "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                  "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
              ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $innoSetupPath) {
              throw "Inno Setup 6 was not found after installation"
          }

          # Older custom Stable branches used fixed local paths. Replacing only these
          # tool paths keeps the selected source code and product version unchanged.
          $bundlePath = "script/bundle-windows.ps1"
          $bundle = Get-Content $bundlePath -Raw
          $bundle = $bundle.Replace(
              "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\Tools\Launch-VsDevShell.ps1",
              $devShell
          )
          $bundle = $bundle.Replace(
              "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64",
              $sdkPath
          )
          $bundle = $bundle.Replace(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              $innoSetupPath
          )
          Set-Content -Path $bundlePath -Value $bundle -Encoding utf8NoBOM

          "ZED_RC_TOOLKIT_PATH=$sdkPath" >> $env:GITHUB_ENV
          Write-Host "Visual Studio: $visualStudioPath"
          Write-Host "Windows SDK tools: $sdkPath"
          Write-Host "Inno Setup: $innoSetupPath"

      - name: Build installer
        shell: pwsh
        run: script/bundle-windows.ps1 -Architecture x86_64

      - name: Verify build
        id: artifact
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.source_sha }}
          EXPECTED_VERSION: ${{ steps.source.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $installer = (Resolve-Path "target/Zed-x86_64.exe").Path
          $remoteServer = (Resolve-Path "target/zed-remote-server-windows-x86_64.zip").Path
          $cli = (Resolve-Path "target/x86_64-pc-windows-msvc/release/cli.exe").Path
          $cliVersion = (& $cli --version | Out-String).Trim()

          if ($cliVersion -notmatch [regex]::Escape($env:EXPECTED_VERSION)) {
              throw "CLI version does not contain the expected version $env:EXPECTED_VERSION`: $cliVersion"
          }
          if ($cliVersion -notmatch [regex]::Escape($env:EXPECTED_SHA)) {
              throw "CLI version does not contain the expected source SHA $env:EXPECTED_SHA`: $cliVersion"
          }

          $installerHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $remoteServerHash = (Get-FileHash $remoteServer -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
              "$installerHash  Zed-x86_64.exe"
              "$remoteServerHash  zed-remote-server-windows-x86_64.zip"
          ) | Set-Content "target/SHA256SUMS.txt" -Encoding ascii

          Write-Host "CLI: $cliVersion"
          Get-Content "target/SHA256SUMS.txt"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Zed-CN-${{ steps.source.outputs.version }}-windows-x86_64
          path: |
            target/Zed-x86_64.exe
            target/zed-remote-server-windows-x86_64.zip
            target/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          RELEASE_REVISION: ${{ steps.inputs.outputs.release_revision }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          CREATE_DRAFT: ${{ steps.inputs.outputs.draft }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $notesPath = "target/release-notes.md"
          $previousTag = git tag --list "zed-cn-v*-r*" --sort=-version:refname |
              Where-Object { $_ -ne $env:RELEASE_TAG } |
              Select-Object -First 1

          $commitBody = git show -s --format=%B HEAD | Out-String
          $releaseNotesMatch = [regex]::Match(
              $commitBody,
              '(?ms)^Zed-CN-Release-Notes:\s*\r?\n(?<notes>.+?)\r?\nZed-CN-Release-Notes-End(?=\r?\n|$)'
          )
          if (-not $releaseNotesMatch.Success) {
              throw "Detailed Zed CN release notes were not found in the Stable source commit."
          }
          $detailedNotes = $releaseNotesMatch.Groups['notes'].Value.Trim()
          $publicMainSha = "${{ steps.source.outputs.public_main_sha }}"
          $previousPublicMainSha = $null
          if ($previousTag) {
              $previousBody = git show -s --format=%B $previousTag | Out-String
              $previousSourceMatch = [regex]::Match(
                  $previousBody,
                  '(?m)^Public-Main-Source:\s*(?<sha>[0-9a-f]{40})\s*$'
              )
              if ($previousSourceMatch.Success) {
                  $previousPublicMainSha = $previousSourceMatch.Groups['sha'].Value
              }
          }

          if ($previousPublicMainSha) {
              $publicMainCommitCount = (git rev-list --count "$previousPublicMainSha..$publicMainSha").Trim()
              $sourceComparison = "公开 main 源码范围：``$previousPublicMainSha..$publicMainSha``（$publicMainCommitCount 个提交）"
          } else {
              $sourceComparison = "公开 main 源码提交：``$publicMainSha``（当前 Stable 发布流程首次记录完整源码范围）"
          }

          $notes = @(
              $detailedNotes
              ""
              "## 源码范围"
              ""
              $sourceComparison
              ""
              "## 构建信息"
              ""
              "- Zed 版本：$env:RELEASE_VERSION"
              "- 定制修订：r$env:RELEASE_REVISION"
              "- 源码提交：``$env:SOURCE_SHA``"
              "- 平台：Windows x86_64"
              "- 发布渠道：stable"
              "- 代码签名：无"
              ""
              "安装包的 SHA-256 见 ``SHA256SUMS.txt``。由于没有 Windows 代码签名，SmartScreen 可能显示警告。"
          )
          $notes | Set-Content $notesPath -Encoding utf8NoBOM

          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
              $arguments = @(
                  "release", "create", $env:RELEASE_TAG,
                  "--repo", "${{ github.repository }}",
                  "--target", $env:SOURCE_SHA,
                  "--title", "Zed CN $env:RELEASE_VERSION r$env:RELEASE_REVISION",
                  "--notes-file", $notesPath
              )
              if ($env:CREATE_DRAFT -eq "true") {
                  $arguments += "--draft"
              }
              & gh @arguments
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to create GitHub Release $env:RELEASE_TAG"
              }
          } else {
              gh release edit $env:RELEASE_TAG `
                  --repo "${{ github.repository }}" `
                  --title "Zed CN $env:RELEASE_VERSION r$env:RELEASE_REVISION" `
                  --notes-file $notesPath
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to update GitHub Release $env:RELEASE_TAG"
              }
          }

          gh release upload $env:RELEASE_TAG `
              "target/Zed-x86_64.exe" `
              "target/zed-remote-server-windows-x86_64.zip" `
              "target/SHA256SUMS.txt" `
              --repo "${{ github.repository }}" `
              --clobber
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload assets to GitHub Release $env:RELEASE_TAG"
          }
