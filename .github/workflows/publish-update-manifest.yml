name: Publish update manifest

on:
  workflow_run:
    workflows: [Build multiplatform release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-cn-update-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'rxp200/zed-cn' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Generate feed from completed public releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/generate-update-manifest.py --output update-site/updates.json
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload only the update feed
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: update-site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify deployed feed
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 30 "${PAGE_URL%/}/updates.json" -o deployed-updates.json && cmp update-site/updates.json deployed-updates.json; then
              exit 0
            fi
            sleep 10
          done
          echo "The deployed update feed could not be verified." >&2
          exit 1
