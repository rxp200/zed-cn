syntax = "proto3";
package zed.messages;

import "core.proto";
import "worktree.proto";

message DownloadFileByPath {
  uint64 project_id = 1;
  uint64 worktree_id = 2;
  string path = 3;
  uint64 file_id = 4;
}

message DownloadFileResponse {
  uint64 file_id = 1;
}

// Pulls one bounded chunk of a remote file. The client requests chunks in
// order and the server sends nothing until the next request, so a download
// never queues ahead of interactive traffic on the shared connection.
message DownloadFileChunk {
  uint64 worktree_id = 1;
  string path = 2;
  uint64 offset = 3;
  uint64 expected_size = 4;
  optional Timestamp expected_mtime = 5;
  uint32 max_bytes = 6;
}

message DownloadFileChunkResponse {
  File file = 1;
  bytes content = 2;
  uint64 total_size = 3;
}

// Lists the regular files below a worktree directory on the server, one bounded
// page at a time. The listing walks the filesystem instead of the worktree
// snapshot so directories that Zed does not index (gitignored or otherwise
// ignored) are still included in a download. Only sent to servers that
// advertised the `list_worktree_files_v1` capability.
message ListWorktreeFiles {
  uint64 worktree_id = 1;
  // Worktree-relative directory to list; empty means the worktree root.
  string path = 2;
  // Last path returned by the previous page; empty starts a listing.
  string cursor = 3;
  // Requested number of paths; the server clamps it to its own bound.
  uint32 max_files = 4;
}

message ListWorktreeFilesResponse {
  // Worktree-relative paths in depth-first, name-sorted order.
  repeated string paths = 1;
  // Cursor for the next page; empty when the listing is complete.
  string next_cursor = 2;
}

message CreateFileForPeer {
  uint64 project_id = 1;
  PeerId peer_id = 2;
  oneof variant {
    FileState state = 3;
    FileChunk chunk = 4;
  }
}

message FileState {
  uint64 id = 1;
  optional File file = 2;
  uint64 content_size = 3;
}

message FileChunk {
  uint64 file_id = 1;
  bytes data = 2;
}
